#
# Add a section when a year's inputs live somewhere else, or when it should be
# joined against a different vintage of the lookup. Anything not overridden falls
# back to [year] above.
#
# Recording the lookup used per year matters more than it looks: the lookup
# carries validity windows, and joining a 2019 dataset against a 2026 lookup is
# not obviously wrong but is worth doing knowingly.
